name: HiFiCompanion
options:
  bundleIdPrefix: com.hificompanion
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
schemes:
  HiFi Companion:
    build:
      targets:
        HiFiCompanion: all
    test:
      targets:
        - HiFiCompanionTests
    run:
      config: Debug
    archive:
      config: Release
targets:
  HiFiCompanion:
    type: application
    platform: macOS
    sources:
      - path: HiFiCompanion
        excludes:
          - Info.plist
          - HiFiCompanion.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hificompanion.app
        PRODUCT_NAME: HiFiCompanion
        PRODUCT_MODULE_NAME: HiFiCompanion
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: HiFiCompanion/Info.plist
        CODE_SIGN_ENTITLEMENTS: HiFiCompanion/HiFiCompanion.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CFBundleDisplayName: HiFi Companion
    entitlements:
      path: HiFiCompanion/HiFiCompanion.entitlements
  HiFiCompanionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HiFiCompanionTests
      - path: HiFiCompanion/Audio/AudioFormatInfo.swift
      - path: HiFiCompanion/Audio/PhysicalFormatChooser.swift
      - path: HiFiCompanion/Detection/FormatParser.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hificompanion.tests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_HOST: ""
        BUNDLE_LOADER: ""
