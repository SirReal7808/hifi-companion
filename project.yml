name: HiFiCompanion
options:
  bundleIdPrefix: com.hificompanion
  deploymentTarget:
    macOS: "14.2"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.1"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.2"
schemes:
  HiFi Companion:
    build:
      targets:
        HiFiCompanion: all
    test:
      targets:
        - HiFiCompanionTests
    run:
      config: Debug
    archive:
      config: Release
targets:
  HiFiCompanion:
    type: application
    platform: macOS
    sources:
      - path: HiFiCompanion
        excludes:
          - Info.plist
          - HiFiCompanion.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hificompanion.app
        PRODUCT_NAME: HiFiCompanion
        PRODUCT_MODULE_NAME: HiFiCompanion
        MARKETING_VERSION: "0.4.2"
        CURRENT_PROJECT_VERSION: "46"
        INFOPLIST_FILE: HiFiCompanion/Info.plist
        CODE_SIGN_ENTITLEMENTS: HiFiCompanion/HiFiCompanion.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CFBundleDisplayName: HiFi Companion
      configs:
        # Debug (and the hosted unit tests) stays ad-hoc; Release ships with
        # Developer ID so notarization works and TCC grants survive updates.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: 3R38CGHB29
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          # xcodebuild build adds get-task-allow (debugger attach) by default;
          # notarization rejects it.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    dependencies:
      - package: Sparkle
    postBuildScripts:
      - name: Sign Sparkle helpers
        script: "\"${SRCROOT}/scripts/sign-sparkle-helpers.sh\""
        basedOnDependencyAnalysis: false
    entitlements:
      path: HiFiCompanion/HiFiCompanion.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
  HiFiCompanionTests:
    type: bundle.unit-test
    platform: macOS
    # Hosted: PEQPanelMetricsTests uses `@testable import HiFiCompanion`.
    dependencies:
      - target: HiFiCompanion
    sources:
      - path: HiFiCompanionTests
      - path: HiFiCompanion/Audio/AudioFormatInfo.swift
      - path: HiFiCompanion/Audio/PhysicalFormatChooser.swift
      - path: HiFiCompanion/Audio/ExclusiveMusicLock.swift
      - path: HiFiCompanion/Audio/DeviceAudioClientProbe.swift
      - path: HiFiCompanion/Audio/VirtualDeviceCatalog.swift
      - path: HiFiCompanion/Audio/OutputPolicy.swift
      - path: HiFiCompanion/Audio/SignalPath.swift
      - path: HiFiCompanion/Audio/OutputDeviceDetails.swift
      - path: HiFiCompanion/Audio/NullTest.swift
      - path: HiFiCompanion/Audio/AudioEventLog.swift
      - path: HiFiCompanion/Audio/AudioOutputDevice.swift
      - path: HiFiCompanion/Audio/PeakingBiquad.swift
      - path: HiFiCompanion/Audio/EQBand.swift
      - path: HiFiCompanion/Audio/PEQEngine.swift
      - path: HiFiCompanion/Audio/SweepOscillator.swift
      - path: HiFiCompanion/Audio/EQProfile.swift
      - path: HiFiCompanion/Audio/PEQHistory.swift
      - path: HiFiCompanion/Audio/PEQDocument.swift
      - path: HiFiCompanion/Audio/EQFormat.swift
      - path: HiFiCompanion/Detection/DetectionSource.swift
      - path: HiFiCompanion/Detection/FormatParser.swift
      - path: HiFiCompanion/Detection/FormatSwitchGate.swift
      - path: HiFiCompanion/Detection/NextTrackGuard.swift
      - path: HiFiCompanion/Detection/LineSplitter.swift
      - path: HiFiCompanion/MenuBarTitle.swift
      - path: HiFiCompanion/EqualizerExclusions.swift
      - path: HiFiCompanion/FirstRun.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hificompanion.tests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HiFiCompanion.app/Contents/MacOS/HiFiCompanion"
        BUNDLE_LOADER: "$(TEST_HOST)"
