# Unit tests on every pull request to main.
# macOS runner minutes count 10x against the private repo's free quota, so this runs
# only for PRs (and on demand), and a newer push to the same PR cancels the old run.
name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "HiFi Companion" \
            -derivedDataPath build \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-test.log \
            | grep -E "Test Suite '.*' (passed|failed)|error:|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)"

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-test-log
          path: xcodebuild-test.log
          retention-days: 7
