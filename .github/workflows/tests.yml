# Unit tests on GitHub — manual only (Actions → Tests → Run workflow).
# Tests run locally before every PR; macOS runner minutes count 10x against the private
# repo's free quota and hosted macOS runners were sometimes unavailable (2026-10-28).
name: Tests

on:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "HiFi Companion" \
            -derivedDataPath build.noindex \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-test.log \
            | grep -E "Test Suite '.*' (passed|failed)|error:|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)"

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-test-log
          path: xcodebuild-test.log
          retention-days: 7
