# Unit tests on GitHub. Runs on every pull request and push to main once the repo is public
# (macOS runners are free on public repos). While the repo is private the job is skipped:
# macOS minutes count 10x against the private quota, and tests run locally before every PR.
# Manual runs (Actions -> Tests -> Run workflow) always work.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "HiFi Companion" \
            -derivedDataPath build.noindex \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-test.log \
            | grep -E "Test Suite '.*' (passed|failed)|error:|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)"

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-test-log
          path: xcodebuild-test.log
          retention-days: 7
